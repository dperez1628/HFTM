services:
  postgres:
    image: postgres:16
    container_name: hftm-postgres
    environment:
      POSTGRES_DB: hftm
      POSTGRES_USER: hftm
      POSTGRES_PASSWORD: hftm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hftm -d hftm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
